name: Atualizar vagas e publicar
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vagas-ti-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testar validação das vagas
        run: python -m unittest discover -s tests -v
      - name: Coletar vagas
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Salvar resultado da varredura
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza vagas e cobertura da varredura'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Sinalizar falha geral da coleta
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Nenhum anúncio pôde ser verificado. A página foi publicada com aviso de indisponibilidade.'
          exit 1
